name: Build Living War

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mod
        run: bash ./build_mod.sh dist
      - name: Package release
        run: zip -r LivingWar-${{ github.sha }}.zip dist/@LivingWar
      - uses: actions/upload-artifact@v4
        with:
          name: LivingWar-${{ github.sha }}
          path: LivingWar-${{ github.sha }}.zip
